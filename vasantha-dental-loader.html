<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Vasantha Dental Clinic — Loader</title>
<style>
  html, body {
    margin: 0;
    padding: 0;
    height: 100%;
    display: flex;
    align-items: center;
    justify-content: center;
    background: radial-gradient(circle at 50% 40%, #ffffff 0%, #f4f7fb 60%, #eef2f7 100%);
    font-family: 'Segoe UI', system-ui, sans-serif;
  }

  .loader-wrap {
    width: min(88vw, 560px);
  }

  svg {
    width: 100%;
    height: auto;
    display: block;
    overflow: visible;
  }

  /* ---------- ICON: tooth outline ---------- */
  #tooth {
    fill: none;
    stroke: #1b3d8f;
    stroke-width: 5;
    stroke-linecap: round;
    stroke-linejoin: round;
    stroke-dasharray: 1150;
    stroke-dashoffset: 1150;
    animation: toothDraw 5s linear infinite;
  }
  #tooth.filled { fill: url(#toothGrad); }

  /* ---------- ICON: V letter ---------- */
  #vletter {
    fill: none;
    stroke: #1b3d8f;
    stroke-width: 4;
    stroke-linecap: round;
    stroke-linejoin: round;
    stroke-dasharray: 810;
    stroke-dashoffset: 810;
    animation: vDraw 5s linear infinite;
  }

  /* ---------- ICON: teal swoosh ---------- */
  #swoosh {
    fill: none;
    stroke: #20b6a8;
    stroke-width: 5;
    stroke-linecap: round;
    stroke-linejoin: round;
    stroke-dasharray: 826;
    stroke-dashoffset: 826;
    animation: swooshDraw 5s linear infinite;
  }

  #tooth, #vletter, #swoosh {
    animation-fill-mode: both;
  }

  /* fill reveal group wraps tooth/v/swoosh fills */
  #toothFill { fill: url(#toothGrad); opacity: 0; animation: fillIn 5s linear infinite; }
  #vFill { fill: url(#vGrad); opacity: 0; animation: fillIn 5s linear infinite; }
  #swooshFill { fill: url(#swooshGrad); opacity: 0; animation: fillIn 5s linear infinite; }

  /* ---------- IMPLANT threads ---------- */
  .implant-ring {
    opacity: 0;
    transform-origin: 512px 360px;
    animation: ringPop 5s linear infinite;
  }
  .implant-ring:nth-child(1) { animation-delay: 0s; }
  .implant-ring:nth-child(2) { animation-delay: .06s; }
  .implant-ring:nth-child(3) { animation-delay: .12s; }
  .implant-ring:nth-child(4) { animation-delay: .18s; }
  .implant-ring:nth-child(5) { animation-delay: .24s; }
  .implant-ring:nth-child(6) { animation-delay: .30s; }
  .implant-ring:nth-child(7) { animation-delay: .36s; }

  #implant { fill: url(#implantGrad); }

  /* ---------- TEXT rows ---------- */
  #row1 {
    fill: #17337e;
    opacity: 0;
    transform: translateY(14px);
    animation: rowIn1 5s linear infinite;
  }
  #row2 {
    fill: #17a39c;
    opacity: 0;
    transform: translateY(14px);
    animation: rowIn2 5s linear infinite;
  }
  #row3 {
    fill: #52525b;
    opacity: 0;
    transform: translateY(14px);
    animation: rowIn3 5s linear infinite;
  }

  /* ================= KEYFRAMES ================= */
  @keyframes toothDraw {
    0%   { stroke-dashoffset: 1150; }
    20%  { stroke-dashoffset: 0; }
    100% { stroke-dashoffset: 0; }
  }
  @keyframes vDraw {
    0%   { stroke-dashoffset: 810; }
    6%   { stroke-dashoffset: 810; }
    26%  { stroke-dashoffset: 0; }
    100% { stroke-dashoffset: 0; }
  }
  @keyframes swooshDraw {
    0%   { stroke-dashoffset: 826; }
    10%  { stroke-dashoffset: 826; }
    28%  { stroke-dashoffset: 0; }
    100% { stroke-dashoffset: 0; }
  }
  @keyframes fillIn {
    0%, 26%  { opacity: 0; }
    36%      { opacity: 1; }
    88%      { opacity: 1; }
    100%     { opacity: 0; }
  }
  @keyframes ringPop {
    0%, 28%  { opacity: 0; transform: scale(.5); }
    34%      { opacity: 1; transform: scale(1); }
    88%      { opacity: 1; transform: scale(1); }
    100%     { opacity: 0; transform: scale(1); }
  }
  @keyframes rowIn1 {
    0%, 34%  { opacity: 0; transform: translateY(14px); }
    44%      { opacity: 1; transform: translateY(0); }
    88%      { opacity: 1; transform: translateY(0); }
    100%     { opacity: 0; transform: translateY(14px); }
  }
  @keyframes rowIn2 {
    0%, 40%  { opacity: 0; transform: translateY(14px); }
    50%      { opacity: 1; transform: translateY(0); }
    88%      { opacity: 1; transform: translateY(0); }
    100%     { opacity: 0; transform: translateY(14px); }
  }
  @keyframes rowIn3 {
    0%, 46%  { opacity: 0; transform: translateY(14px); }
    56%      { opacity: 1; transform: translateY(0); }
    88%      { opacity: 1; transform: translateY(0); }
    100%     { opacity: 0; transform: translateY(14px); }
  }
</style>
</head>
